[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triparsegpu"
version = "0.1.0"
description = "GPU-native log template mining"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["triparsegpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
